name: 提交鬼点子
description: 一句话设定、一个玩家动作、一个最好笑的瞬间。
title: "鬼点子："
labels: [enhancement]
body:
  - type: textarea
    id: premise
    attributes:
      label: 一句话设定
      description: 人类和 AI 因为什么离谱问题展开竞争？
      placeholder: 人类大战 AI 抢被子，AI 正在优化全宿舍热力学。
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: 玩家怎么操作
      description: 写出玩家做什么、系统如何回应，最好能用一句话解释。
      placeholder: 按住蓄力、松手扯被子；扯太猛会把室友叫醒。
    validations:
      required: true
  - type: textarea
    id: moment
    attributes:
      label: 最好笑的瞬间
      description: 哪个画面会让你想分享到群里？
      placeholder: AI 开始引用宿舍公约，人类把被子披着去上早八。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充材料（可选）
      description: 草图、玩法参考、声音想法，或一句饭后感言。
